name: Source and application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_source_only.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript
        run: for file in cad-workbench/static/*.js cad-workbench/static/appearance/*.js; do node --check "$file"; done
      - run: node --test tests/*.test.js
  application:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PID_DISABLE_DWG_CONVERTER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: cad-workbench/requirements.txt
      - run: python -m pip install -r cad-workbench/requirements.txt
      - run: python -m compileall -q cad-workbench
      - run: python -m unittest discover -s cad-workbench/tests -p "test_*.py" -v
