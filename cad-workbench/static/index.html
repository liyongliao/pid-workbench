<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PID · 图纸工作台</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="app-header"><a class="brand" href="/"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><b>PID · 图纸工作台</b></a><span class="project">工程图纸库</span><nav aria-label="工作区"><button class="nav active" data-tab="drawings">图纸</button><button class="nav" data-tab="equipment">设备</button><button class="nav" data-tab="logic">因果逻辑</button></nav><div class="source-state"><i></i> 原始 CAD 数据</div><button id="missingList" class="audit-button">缺图清单</button><button id="manageMode" hidden class="audit-button" aria-pressed="false">管理模式</button><button id="saveAllCAD" class="solid-button" hidden>统一保存</button><button id="reviewAudit" class="audit-button" title="查看原文核对记录">核对记录</button><button id="coverage" class="icon-button" title="文件覆盖与数据说明" aria-label="文件覆盖与数据说明">ⓘ</button><button id="accountButton" class="audit-button">账户</button></header>
<div class="workspace" id="workbenchShell"><aside class="sidebar"><div class="side-title"><h2>图纸目录</h2><span id="fileCount" class="tiny"></span></div><label class="search"><span>⌕</span><input id="search" aria-label="搜索图名、图号或设备位号" placeholder="搜索图名、图号或设备位号" autocomplete="off"><kbd>/</kbd></label><div class="filter-label">平台</div><div id="platforms" class="platforms"></div><div class="library-filters" aria-label="图纸快捷筛选"><button data-library-filter="all" class="active" aria-pressed="true">全部</button><button data-library-filter="favorites" aria-pressed="false">收藏</button><button data-library-filter="recent" aria-pressed="false">最近浏览</button></div><div id="listCaption" class="list-caption">全部图纸</div><div id="drawingList" class="drawing-list" aria-label="图纸列表"></div><div class="side-bottom"><button id="fileCoverage">▤ 文件覆盖</button><button id="sourceDownload">↧ CAD 源图</button></div></aside>
<main class="main" id="drawingWorkbench"><section class="drawing-head"><div class="drawing-heading"><div id="breadcrumb" class="breadcrumb">工程图纸库 / 工艺流程</div><h1 id="drawingTitle">正在载入图纸…</h1></div><div class="drawing-actions"><div class="segmented"><button id="chineseMode" class="selected">中文图纸</button><button id="originalMode">原文对照</button></div><button id="fit" title="适合窗口（F）">⛶ <span>适合窗口</span></button><button id="wideMode" aria-pressed="false" title="隐藏目录和详情，铺满网页">▣ <span>网页大屏</span></button><button id="fullscreen" title="进入屏幕全屏">⛶ <span>全屏</span></button><div class="export-wrap"><button id="exportToggle">↧ <span>导出</span></button><div class="export-menu" id="exportMenu" hidden><button data-export="dwg">中文 DWG · 可编辑</button><button data-export="dxf">中文 DXF · 可编辑</button><button data-export="pdf">中文 PDF · 阅读版</button><button data-export="original">原始 DWG</button><button data-export="ledger">图元与译文对照</button></div></div></div></section>
<section id="canvas" class="canvas" aria-label="可交互 CAD 图纸"><div id="emptyCanvas" class="canvas-message">正在载入 CAD 矢量图纸</div><svg id="viewport" role="img" aria-label="图纸画布" xmlns="http://www.w3.org/2000/svg"><g id="scene"></g><g id="hitAreas"></g><g id="selection"></g></svg><div class="canvas-top-left"><span id="modeLabel">中文图纸</span><span id="drawingRevision"></span></div><div class="canvas-tip">拖动平移 · 滚轮缩放 · 点击设备或关联图号查询</div><div class="zoom-controls"><button id="back" title="返回上一张图纸" aria-label="返回上一张图纸">←</button><span class="divider"></span><button id="zoomOut" aria-label="缩小">−</button><span id="zoomValue">100%</span><button id="zoomIn" aria-label="放大">＋</button><span class="divider"></span><button id="fitSmall" aria-label="适合窗口">⛶</button><button id="toggleHotspots" title="显示设备位置" aria-label="显示设备位置">◎</button></div></section>
<section id="tableView" class="table-view" hidden></section></main>
<aside id="inspector" class="inspector"><div class="inspector-header"><h2><i></i><span id="inspectorHeading">图纸信息</span></h2><button id="clearSelection" class="icon-button" aria-label="清除选择">×</button></div><div id="inspectorBody" class="inspector-body"></div><div class="inspector-footer"><button id="favoriteDrawing" class="favorite-drawing" disabled aria-pressed="false">☆ 收藏当前图纸</button><button id="editBlockAttributes" class="primary-outline" hidden>编辑 / 新增块属性</button><button id="editSelectedLink" class="primary-outline" hidden>编辑此处图纸关联</button><button id="locate" class="primary-outline">◎ 定位到图纸</button></div></aside></div>
<footer class="statusbar"><span><i class="status-dot"></i><span id="status">正在建立图纸视图</span></span><span id="statusRight">CAD 矢量 · 本地工作台</span></footer>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" class="icon-button" aria-label="关闭">×</button></div><div id="dialogBody"></div></dialog><div id="toast" role="status"></div>
<script src="/library.js"></script><script src="/system.js"></script><script src="/account.js"></script><script src="/app.js"></script><script src="/admin.js"></script></body></html>
