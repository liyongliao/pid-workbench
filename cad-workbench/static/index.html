<div id="linkedViews" data-layout="split"><div class="view-toolbar"><div class="view-switch" role="group" aria-label="视口布局"><button data-layout="split" aria-pressed="true">◫　分屏</button><button data-layout="drawing" aria-pressed="false">图纸</button><button data-layout="model" aria-pressed="false">模型</button></div><span class="link-state"><i></i> 对象联动</span></div><div class="view-pair"><section id="sheetPane"><div class="pane-title"><b>P&amp;ID 图纸</b><span>CAD 矢量</span></div><section id="canvas" class="canvas" aria-label="可交互 CAD 图纸"><div id="emptyCanvas" class="canvas-message">正在载入 CAD 矢量图纸</div><svg id="viewport" role="img" aria-label="图纸画布" xmlns="http://www.w3.org/2000/svg"><g id="scene"></g><g id="hitAreas"></g><g id="selection"></g></svg><div class="canvas-top-left"><span id="modeLabel">中文图纸</span><span id="drawingRevision"></span></div><div class="canvas-tip">拖动平移 · 滚轮缩放 · 点击设备或关联图号查询</div><div class="zoom-controls"><button id="back" title="返回上一张图纸" aria-label="返回上一张图纸">←</button><span class="divider"></span><button id="zoomOut" aria-label="缩小">−</button><span id="zoomValue">100%</span><button id="zoomIn" aria-label="放大">＋</button><span class="divider"></span><button id="fitSmall" aria-label="适合窗口">⛶</button><button id="toggleHotspots" title="显示设备位置" aria-label="显示设备位置">◎</button></div></section>
</section><section id="modelPane"><div class="pane-title"><b>三维模型</b><select id="modelSource" aria-label="三维模型来源"><option value="sheet">按本图生成</option></select><button id="processOnly" hidden title="仅显示已分类的管线、设备、阀门和仪表" aria-pressed="false">工艺</button><button id="modelInspect" hidden aria-pressed="false" title="选择模型表面一点，读取附近原始几何">局部精查</button><select id="sheetView" aria-label="装配视角" hidden></select><button id="modelReset" title="复位模型视角">↺ 复位</button></div><div id="sheetReview" class="sheet-review" hidden><span id="sheetReviewInfo"></span><select id="sheetChanges" aria-label="定位增强构件" hidden></select><button id="sheetCompare">查看原自动模型</button><button id="sheetApprove" disabled>通过并上线</button><button id="sheetReject">退回</button><button id="sheetBack">返回队列</button></div><div id="modelStage"><div class="model-searchbox" hidden><input type="search" id="modelQuery" placeholder="查找管线、设备或阀门…" aria-label="查找平台模型构件"><select id="modelKind" aria-label="构件类别"><option value="">全部类型</option><option>管线</option><option>设备</option><option>阀门</option><option>仪表</option><option>构件</option></select></div><div id="modelResults" hidden></div><canvas id="modelSurface" tabindex="0" aria-label="三维工艺示意，拖动旋转，滚轮缩放。可通过本图对象列表选择图元。"></canvas><div id="modelEmpty" hidden>此图暂无可识别的工艺对象</div><div id="modelTag" hidden></div><button id="modelMore" hidden>继续加载附近构件</button><div class="model-foot"><details id="modelBasis" hidden><summary>建模依据</summary></details><span id="modelSourceNote">按本图生成 · 高度与尺寸为示意</span><button id="modelFocus" disabled>聚焦所选</button></div></div></section></div></div><section id="tableView" class="table-view" hidden></section></main>

<footer class="statusbar"><span><i class="status-dot"></i><span id="status">正在建立图纸视图</span></span><span id="statusRight">CAD 矢量 · 本地工作台</span></footer>
<dialog id="sheetPrintDialog" aria-labelledby="sheetPrintTitle">

 </dialog><dialog id="dialog"><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" class="icon-button" aria-label="关闭">×</button></div><div id="dialogBody"></div></dialog><div id="toast" role="status"></div>
