<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图纸打印预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e8e5;color:#242b30;font:14px system-ui,sans-serif}header{position:sticky;top:0;z-index:1;background:#fff;border-bottom:1px solid #dad9d5;display:flex;align-items:center;gap:16px;padding:12px 4vw}h1{font-size:17px;margin:0}#status{flex:1}button{border:1px solid #cecac5;background:#fff;border-radius:7px;padding:7px 16px;font:inherit;cursor:pointer}#print{background:#be481e;color:#fff;border-color:transparent}button:disabled{opacity:.5;cursor:default}main{padding:16px}.sheet{aspect-ratio:410/286;max-width:1100px;margin:0 auto 16px;background:white;padding:.5%;box-shadow:0 2px 8px #0002}.sheet img{width:100%;height:100%;object-fit:contain;display:block}.measure{position:fixed;left:-2000px;top:0;width:900px;height:640px;border:0;pointer-events:none}
@page{size:A3 landscape;margin:5mm}@media print{body,main{margin:0;padding:0;background:white}header,.measure{display:none!important}.sheet{width:100%;height:calc(100vh - 1mm);aspect-ratio:auto;max-width:none;margin:0;padding:0;box-shadow:none;break-inside:avoid;break-after:page}.sheet:last-child{break-after:auto}body:not(.ready) main{display:none}body:not(.ready)::before{content:'图纸尚未准备完成，请返回预览'} }
</style></head><body><header><h1>打印预览</h1><span id="status" role="status">正在读取图纸…</span><button id="retry" hidden>重试</button><button id="print" disabled>打印</button></header><main></main>
<script src="/sheet-frame.js"></script><script src="/print-sheets.js"></script></body></html>
