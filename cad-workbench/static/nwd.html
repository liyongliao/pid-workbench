<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NWD 模型审查 · PID</title><link rel="stylesheet" href="/nwd.css"><link rel="stylesheet" href="/workspace-ui.css"><link rel="stylesheet" href="/twin.css"><link rel="stylesheet" href="/review-ui.css"><script defer src="/product-header.js"></script><script type="importmap">{"imports":{"three":"/three.module.min.js"}}</script></head>
<body><product-header section="twin"></product-header><header class="twin-bar"><div class="platform-id"><h1 id="platformName">数字孪生</h1><small>海上平台数字孪生</small></div><div class="switch-glass"><div class="twin-tabs"><a id="overviewLink" href="/twin.html">平台总览</a><a id="reviewLink" href="/nwd.html" aria-current="page">NWD 模型审查</a></div><label class="platform-control">平台<select id="model" aria-label="平台模型"></select></label><span id="source"></span></div></header>
<nav><div id="panels"><button data-panel="views">▤　视图</button><button data-panel="tree">⑂　模型浏览器</button><button data-panel="props">ⓘ　特性</button><button class="embed-settings" data-panel="settings">设置</button></div><div id="reviewActions"><button data-panel="tour" id="routeButton">巡航路线</button><button id="present" disabled>▶ 宣传模式</button><button id="publish" type="button" hidden>保存并发布</button><button data-panel="notes">✎　批注</button><details class="action-menu"><summary aria-label="更多操作">•••</summary><div class="menu-list" id="reviewMenu"><button id="importModel" hidden>导入模型…</button><button id="share">分享模型</button><button id="snapshot">保存快照</button><button id="print">打印</button><button data-panel="settings">显示设置</button></div></details></div></nav>
<main><aside id="side"><div class="panelHead"><h2></h2><button id="close" aria-label="关闭面板">×</button></div><div id="panel"></div></aside>
<section id="stage"><canvas id="canvas" tabindex="0" aria-label="平台三维模型"></canvas><canvas id="reviewCanvas" hidden tabindex="0" aria-label="NWD 审查模型"></canvas><div id="labels"></div><section id="treeWindow" hidden><div id="treeGrip" class="panelHead"><h2>模型浏览器</h2><button id="closeTree" aria-label="关闭模型浏览器">×</button></div><div id="floatingTree"></div></section><label id="nativeViews" hidden>预设视角 <select id="preset" aria-label="预设视角"></select></label>
<section id="componentCard" hidden><div class="panelHead"><h2>构件详情</h2><button id="closeCard" aria-label="关闭构件详情">×</button></div><div id="componentBody"></div></section>
<div id="tourDock" hidden><div class="dock-title">巡航路线 <small>循环播放</small></div><div class="dock-route"><button id="dockPlay" aria-label="播放巡航">▶</button><div id="stops"></div></div></div>
<div id="film" hidden><div class="film-caption"><h2></h2><p></p></div><div class="film-controls"><span id="filmCount"></span><button id="pauseFilm">暂停</button><button id="fullFilm">全屏</button><button id="exitFilm">退出 Esc</button></div></div>
<div id="orientation" aria-label="模型方向"><div id="cube"><button data-face="front">前</button><button data-face="back">后</button><button data-face="right">右</button><button data-face="left">左</button><button data-face="top">上</button><button data-face="bottom">下</button></div></div><div id="status" role="status">正在读取模型…</div><div id="selection" hidden><strong id="selectionName"></strong><button id="selectionContext" type="button">周围线稿</button><button id="deleteSelection" type="button" hidden>删除构件</button><button id="clearSelection" type="button" aria-label="退出构件聚焦" title="退出构件聚焦">×</button></div><div id="tools" aria-label="模型导航"></div></section></main>
<footer><span id="revision">工程模型</span><span id="hint">拖动旋转 · 滚轮缩放 · 右键平移</span><span id="progress"></span></footer>
<dialog id="dialog"><form method="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><div class="actions"><button value="cancel">关闭</button><button id="confirm" value="ok" class="primary">确定</button></div></form></dialog>
<script src="/project-settings.js"></script><script type="module" src="/nwd.js"></script><script src="/workspace-ui.js"></script></body></html>
