<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 图纸工作台</title><link rel="stylesheet" href="/login.css"></head>
<body><header class="mast"><a href="/" class="brand"><span aria-hidden="true" class="mark"><i></i><i></i><i></i><i></i></span>图纸工作台</a></header>
<main class="login-shell"><section class="intro"><div class="project-name"><h1 id="projectName">工程资料中心</h1><p id="projectDescription">工程图纸与资料管理</p></div></section>
<section class="login-panel"><div class="form-wrap">
<h2 id="formTitle">登录工作台</h2><p id="formHelp" class="muted" role="status">正在检查登录状态…</p>
<form id="loginForm" hidden><div class="role-tabs" role="group" aria-label="登录身份">
<button type="button" data-role="viewer" aria-pressed="true">普通用户</button><button type="button" data-role="editor" aria-pressed="false">专业编辑</button><button type="button" data-role="admin" aria-pressed="false">管理员</button></div>
<label id="loginLabel" hidden>登录账号<input id="username" name="username" type="text" autocomplete="username" maxlength="64"></label>
<label for="password">访问密码</label><div class="password-row"><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button type="button" id="showPassword" aria-pressed="false" aria-label="显示密码">显示</button></div>
<button class="primary" type="submit">登录</button>
<details class="recovery"><summary>忘记账号或密码？</summary><p id="recoverHelp"></p></details></form>
<form id="setupForm" hidden><label>管理员姓名或账号<input name="login" required maxlength="64" autocomplete="username"></label>
<label>管理员密码<input name="adminPassword" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label>
<label>确认管理员密码<input name="adminConfirm" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label>
<label>普通用户密码<input name="viewerPassword" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label>
<label>确认普通用户密码<input name="viewerConfirm" type="password" required minlength="8" maxlength="128" autocomplete="new-password"></label><button class="primary">保存并进入工作台</button></form>
<p id="loginError" class="error" role="alert"></p></div></section></main><div class="page-foot" aria-hidden="true"></div><script src="/login.js"></script></body></html>
