<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 东方图纸工作台</title><link rel="stylesheet" href="/login.css"></head><body><main class="login-shell"><section class="intro"><a class="brand" href="/">▦ <strong>PID · 图纸工作台</strong></a><div><span class="eyebrow">工程图纸库 · 工程资料</span><h1>每一张图纸，<br>都有清晰的来路。</h1><p>从工艺流程到设备参数，<br>连接原始图纸与现场信息。</p><div class="diagram" aria-hidden="true"><span>工艺流程</span><i></i><span>设备信息</span><i></i><span>关联图纸</span></div></div><small>原始 CAD 数据 · 中文图纸 · 关联查询</small></section><section class="login-panel"><div class="form-wrap"><span class="eyebrow" id="formKicker">欢迎使用</span><h2 id="formTitle">登录图纸工作台</h2><p id="formHelp" class="muted">正在检查登录状态…</p><form id="loginForm" hidden><div class="role-tabs" aria-label="登录身份"><button type="button" data-role="viewer" aria-pressed="true" class="selected">普通用户</button><button type="button" data-role="admin" aria-pressed="false">管理员</button></div><input id="username" name="username" autocomplete="username" value="viewer" hidden><label>访问密码<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="请输入普通用户密码"></label><label class="show-password"><input type="checkbox" id="showPassword">显示密码</label><button class="primary" type="submit">登录并进入工作台 →</button></form><form id="setupForm" hidden><label>管理员密码<input name="adminPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="至少 8 个字符"></label><label>确认管理员密码<input name="adminConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label>普通用户密码<input name="viewerPassword" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="与管理员密码不同"></label><label>确认普通用户密码<input name="viewerConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><button class="primary" type="submit">保存密码并以管理员进入 →</button></form><p id="loginError" class="error" role="alert"></p><p class="footnote" id="loginNote">普通用户可浏览、查询和下载；管理员可上传图纸、编辑属性与关联。</p></div><small class="login-footer">工程图纸库 / 图纸资料系统</small></section></main><script src="/login.js"></script></body></html>
