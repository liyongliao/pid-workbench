name: pid-workbench
services:
  workbench:
    image: pid-workbench:2.3.0-fnos
    pull_policy: never
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,nosuid,nodev,mode=1777
      - /home/workbench:rw,nosuid,nodev,uid=1000,gid=1000,mode=0700
    ports:
      - "${PID_BIND_IP:-127.0.0.1}:${PID_PUBLISHED_PORT:-8765}:8765"
    environment:
      PID_PUBLIC_ORIGINS: "${PID_PUBLIC_ORIGINS:?set the trusted browser origin including scheme and port}"
    volumes:
      - type: bind
        source: "${PID_LIBRARY_DIR:?set the absolute library parent directory}"
        target: /library
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${PID_LIBRARY_DIR}/cad-workbench"
        target: /library/cad-workbench
        bind: {create_host_path: false}
